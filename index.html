<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grand Finale - A Tribute to Excellence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #030303;
            font-family: 'Playfair Display', serif;
            overflow: hidden; color: #d4af37;
        }

        #stage-container {
            position: relative;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 80%);
            overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* The Spotlight behind the photo */
        .spotlight {
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
        }

        #photo {
            max-width: 75%; max-height: 60%;
            object-fit: contain;
            z-index: 1;
            opacity: 0; /* Starts hidden for the cross-fade */
            transition: opacity 2s ease-in-out;
            filter: sepia(10%) contrast(1.05);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        #caption {
            position: absolute; bottom: 12%;
            width: 60%; text-align: center;
            font-size: 24px; font-style: italic;
            color: #d4af37; text-shadow: 0 2px 10px #000;
            opacity: 0; transition: opacity 1.5s ease;
            z-index: 2; line-height: 1.6;
            letter-spacing: 0.5px;
        }

        /* Luxury Curtains */
        .curtain {
            position: absolute; top: 0; width: 50.5%; height: 100%;
            background: #000c1a; 
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.4) 0%, transparent 50%, rgba(0,0,0,0.4) 100%),
                repeating-linear-gradient(90deg, #001226 0px, #001226 2px, #001a33 4px, #001a33 40px);
            transition: transform 3.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .curtain-left { left: 0; border-right: 1px solid rgba(212, 175, 55, 0.5); }
        .curtain-right { right: 0; border-left: 1px solid rgba(212, 175, 55, 0.5); }

        .open .curtain-left { transform: translateX(-100%) skewY(-2deg); }
        .open .curtain-right { transform: translateX(100%) skewY(2deg); }

        /* The Start Button */
        #welcome-btn {
            position: absolute; z-index: 10;
            padding: 25px 60px; font-size: 20px;
            background: none; color: #d4af37;
            border: 1px solid #d4af37; cursor: pointer;
            text-transform: uppercase; letter-spacing: 8px;
            transition: all 0.8s ease;
        }
        #welcome-btn:hover { background: rgba(212, 175, 55, 0.1); letter-spacing: 12px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        #welcome-btn.hidden { opacity: 0; pointer-events: none; }

        /* Final Slide Message */
        #final-slide {
            position: absolute; z-index: 2;
            text-align: center; opacity: 0;
            transition: opacity 5s ease;
            max-width: 800px; display: none;
        }
        #final-slide h1 { font-size: 72px; margin-bottom: 20px; font-weight: 400; letter-spacing: 15px; text-transform: uppercase; }
        #final-slide p { font-size: 22px; line-height: 2; color: #c0c0c0; font-style: italic; }
    </style>
</head>
<body>

<audio id="bg-music" loop src="https://pixabay.com/music/download/121852/"></audio>
<audio id="swish" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a731f7.mp3"></audio>

    <div id="stage-container">
        <div class="spotlight"></div>
        <button id="welcome-btn" onclick="startShow()">Begin the Tribute</button>
        
        <img id="photo" src="" alt="">
        <div id="caption"></div>

        <div id="final-slide">
            <h1>Thank You</h1>
            <p>For the mentorship that guided us, the leadership that inspired us, and the legacy that will remain long after the final curtain falls.</p>
            <p style="margin-top: 50px; color: #d4af37; font-size: 28px; letter-spacing: 3px;">— With Gratitude, Sourav</p>
        </div>

        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
    </div>

    <script>
        const slideshow = [
            { file: "1.jpg", text: "Honoring a career built on integrity and vision." },
            { file: "2.jpg", text: "Leading by example: The foundation of our team's success." },
            { file: "3.jpg", text: "Your mentorship has been the compass for our professional growth." },
            { file: "5.jpg", text: "Celebrating the milestones and the impact of your journey." },
            { file: "6.jpg", text: "A legacy of excellence that will continue to inspire us." },
            { file: "12.jpg", text: "Wishing you a retirement as remarkable as your career." }
        ];

        let currentIndex = 0;
        const stage = document.getElementById('stage-container');
        const photo = document.getElementById('photo');
        const caption = document.getElementById('caption');
        const btn = document.getElementById('welcome-btn');
        const finalSlide = document.getElementById('final-slide');
        const bgMusic = document.getElementById('bg-music');
        const swish = document.getElementById('swish');

        function startShow() {
            btn.classList.add('hidden');
            bgMusic.volume = 0.4;
            bgMusic.play().catch(e => {});
            runShow();
        }

        function runShow() {
            if (currentIndex < slideshow.length) {
                photo.style.opacity = "0"; 
                photo.src = slideshow[currentIndex].file;
                caption.innerText = slideshow[currentIndex].text;

                setTimeout(() => {
                    stage.classList.add('open');
                    photo.style.opacity = "1"; // Fade in after curtains start moving
                    caption.style.opacity = "1";
                    if(swish) swish.play().catch(e => {});

                    setTimeout(() => {
                        stage.classList.remove('open');
                        photo.style.opacity = "0"; // Fade out as curtains close
                        caption.style.opacity = "0";
                        if(swish) swish.play().catch(e => {});

                        currentIndex++;
                        setTimeout(runShow, 4000); 
                    }, 7000); // 7 Seconds viewing time for senior tribute
                }, 1000);
            } else {
                showFinalThankYou();
            }
        }

        function showFinalThankYou() {
            photo.style.display = "none";
            caption.style.display = "none";
            finalSlide.style.display = "block";

            setTimeout(() => {
                stage.classList.add('open');
                finalSlide.style.opacity = "1";
                if(swish) swish.play().catch(e => {});

                let fade = setInterval(() => {
                    if (bgMusic.volume > 0.02) bgMusic.volume -= 0.02;
                    else { bgMusic.pause(); clearInterval(fade); }
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
